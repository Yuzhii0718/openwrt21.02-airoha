server {
    listen       80;
    listen       [::]:80;

    set $rs 0;
    set $init 0;

    if (-e /etc/config/https/init_flag) {
        set $init 1;
    }
    if (-e /etc/config/https/redirect_https) {
        set $rs "${init}1";
    }
    if ($request_uri ~* /currentsetting.htm) {
        set $rs "${init}0";
    }
    if ($request_uri ~* /soap/server_sa/) {
        set $rs "${init}0";
    }

    if ($rs = "11") {
        rewrite ^(.*)$  https://$host$1 redirect;
    }

    include /etc/nginx/service.conf;
}